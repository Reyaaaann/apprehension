name: Build
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --target Apprehension_VST3
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\apprehension.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Apprehension-Windows
          path: installer/Output/Apprehension-Setup.exe
